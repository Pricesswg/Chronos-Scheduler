reload:
  name: Reload
  description: Reload Chronos configuration from storage.

fire_block:
  name: Fire current block now
  description: >
    Immediately execute the currently active time block of a schedule,
    bypassing weather rules. Useful to manually verify that the automations
    work without waiting for the next block transition.
  fields:
    schedule_id:
      name: Schedule ID
      description: Schedule id (copyable chip in the editor header)
      required: true
      example: "abc12345"
      selector:
        text:

schedule_toggle:
  name: Enable/disable schedule
  description: >
    Enable or disable a Chronos schedule. Meant to be called from HA
    automations: schedules are not exposed as entities, this service is the
    equivalent of the toggle in the card. Target by schedule id or by name
    (the name must be unique; on a tie the service does nothing and logs a
    warning).
  fields:
    schedule_id:
      name: Schedule ID
      description: Schedule id, alternative to the name (copyable chip in the editor header)
      required: false
      example: "abc12345"
      selector:
        text:
    name:
      name: Schedule name
      description: Exact schedule name, case-insensitive (alternative to the id)
      required: false
      example: "Garden irrigation"
      selector:
        text:
    enabled:
      name: Enabled
      description: true to enable, false to disable
      required: true
      selector:
        boolean:

pause:
  name: Pause schedule
  description: >
    Pause a schedule until a date and time, or until midnight when no
    `until` is given (the same as the card's Skip today). Chronos leaves the
    schedule's devices alone until then; what it had switched on is switched
    off first, so nothing stays running because its switch-off was paused.
    Target by schedule id or by unique name.
  fields:
    schedule_id:
      name: Schedule ID
      description: Schedule id, alternative to the name
      required: false
      example: "abc12345"
      selector:
        text:
    name:
      name: Schedule name
      description: Exact schedule name, case-insensitive (alternative to the id)
      required: false
      example: "Garden irrigation"
      selector:
        text:
    until:
      name: Until
      description: Date and time the schedule resumes. Empty = skip today (until midnight).
      required: false
      example: "2026-09-08 18:00"
      selector:
        datetime:

resume:
  name: Resume schedule
  description: End a pause now. The active block, if any, is applied at once.
  fields:
    schedule_id:
      name: Schedule ID
      description: Schedule id, alternative to the name
      required: false
      example: "abc12345"
      selector:
        text:
    name:
      name: Schedule name
      description: Exact schedule name, case-insensitive (alternative to the id)
      required: false
      example: "Garden irrigation"
      selector:
        text:

set_mode:
  name: Set mode
  description: >
    Switch Chronos between home, away and holiday. Schedules restricted to
    other modes stop and what they had switched on is switched off;
    schedules of the new mode apply their active block at once. Same as the
    mode selector in the card and the select entity.
  fields:
    mode:
      name: Mode
      required: true
      example: "away"
      selector:
        select:
          options:
            - home
            - away
            - holiday
